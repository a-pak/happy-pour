<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color: #f6f6f6;">
<table align="center" cellpadding="0" cellspacing="0" style=" width: 100%; border-collapse: collapse; background-color: #ffffff; padding: 20px; margin-top: 20px;">
    <tr>
        <td align="center" style="padding-bottom: 30px;">
            <h2 style="color: #333333;">Verify Your Email Address</h2>
        </td>
    </tr>
    <tr>
        <td style="text-align: center;">
            <p style="color: #666666; font-size: 16px;">Hi <span th:text="${userName}">User</span>,</p>
            <p style="color: #666666; font-size: 16px;">Thank you for registering. Please verify your email address by clicking the button below:</p>
        </td>
    </tr>
    <tr>
        <td align="center" style="padding: 30px 0;">
            <a th:href="${verificationLink}"
               style="background-color: #007bff; color: white; padding: 12px 25px; text-decoration: none; font-size: 16px; border-radius: 5px; display: inline-block;">
                Verify Email
            </a>
        </td>
    </tr>
    <tr>
        <td style="color: #f6f6f6; font-size: 14px; text-align: center; padding: 20px">
            <p>If the button doesn't work, copy and paste this link into your browser:</p>
            <a th:href="${verificationLink}" th:text="${verificationLink}"
               style="color: #f6f6f6; word-break: break-all; word-wrap: break-word; overflow-wrap: break-word; display: inline-block; max-width: 100%;"></a>

        </td>
    </tr>
    <tr>
        <td style="padding-top: 40px; text-align: center; font-size: 12px; color: #aaaaaa;">
            <p>© 2025 Happy Pour.</p>
        </td>
    </tr>
</table>
</body>
</html>
