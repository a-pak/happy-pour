spring.application.name=happypour
spring.app.address=http://localhost:8080
debug=false
spring.web.resources.static-locations=classpath:/static/dist
jwt.secret=143930405c789b84cd41a27xx814980a42053feea1720074e089831c2121741

# H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never


spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Enable logging for Spring security
logging.level.org.springframework.security=DEBUG
logging.level.com.happypour=DEBUG

# Enable detailed logging for JWT authentication filter class
logging.level.com.happypour.security.filter.JwtAuthenticationFilter=DEBUG

# Request/Response logging for incoming HTTP requests
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# React Frontend
happypour.app.address=http://localhost:3000
