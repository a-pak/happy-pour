version: "3.9"

services:
  database:
    image: postgres:16
    container_name: postgres-database
    environment:
      POSTGRES_DB: happypour_dev
      POSTGRES_USER: spring
      POSTGRES_PASSWORD: happypour
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d happypour_dev -U spring"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: happy-pour-app
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/happypour_dev
      SPRING_DATASOURCE_USERNAME: spring
      SPRING_DATASOURCE_PASSWORD: happypour          
      REACT_APP_ADDRESS: http://localhost:8080/api
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JWT_SECRET: secret_key_here
    depends_on:
      - database
    networks:
      - app-network

  frontend:
    container_name: react-frontend
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "80:80"   # host:container
    depends_on:
      - backend
    networks:
      - app-network

  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx-proxy
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge